{{define "content"}}
<section class="hero">
  <div class="live-indicator" aria-label="Live now">
    <span class="dot"></span> LIVE NOW
  </div>
  <h1 class="hero-title">{{.StationName}}</h1>
  <p class="hero-tag">Uplifting Christian music, faith-based talk and family-friendly radio — 87.6, 87.8 and 88.0 FM across Australia.</p>

  <div class="hero-actions">
    <a href="/programs" class="btn-primary">📻 Browse programs</a>
    <button class="btn-ghost" type="button" data-trigger="dock-toggle">📬 Get in touch</button>
  </div>

  <p class="hint">Tap the play button below to tune in. The player stays with you as you navigate.</p>
</section>
{{end}}
