name: Keep Supabase & Render alive

# Supabase's free tier pauses a project after 7 days with no activity,
# and Render's free tier sleeps a web service after 15 minutes of idle.
# This workflow pings both daily so a visitor hitting the portfolio
# demo always finds a live app on a live database.

on:
  schedule:
    # 07:43 UTC daily (off-hour to avoid cron rush — GitHub spreads load
    # better when workflows don't start at exactly :00).
    - cron: '43 7 * * *'
  workflow_dispatch:  # allow a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase (read one row from a public table)
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SB_URL" ] || [ -z "$SB_KEY" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY secrets are required"
            exit 1
          fi
          code=$(curl -sS -o /tmp/body -w "%{http_code}" \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY" \
            "$SB_URL/rest/v1/programs?select=id&limit=1")
          echo "Supabase responded: $code"
          head -c 200 /tmp/body; echo
          # 2xx is fine; anything else fails the job so GitHub emails you.
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]

      - name: Ping Render /healthz (keeps the container warm)
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
        run: |
          # Secret-based `if:` conditions are unreliable because secrets
          # are redacted — do the skip in shell instead.
          if [ -z "$RENDER_URL" ]; then
            echo "RENDER_URL secret not set — skipping Render ping."
            exit 0
          fi
          # Cold starts on Render free tier can take ~60s, so allow 90s.
          code=$(curl -sS -o /tmp/health -w "%{http_code}" --max-time 90 "$RENDER_URL/healthz")
          echo "Render responded: $code"
          cat /tmp/health; echo
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
